# Render deployment manifest for the InstaChef AI project.

services:
  - type: web
    name: instachef-backend
    runtime: docker
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: backend/Dockerfile
    rootDir: .
    healthCheckPath: /health
    envVars:
      - key: MOCK_MCP
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb

  - type: web
    name: instachef-frontend
    runtime: node
    branch: main
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: instachef-backend
          property: host
